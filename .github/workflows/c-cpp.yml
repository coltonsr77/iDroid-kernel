name: C/C++ CI

on:
  push:
    branches: [ "idroid-3.0.0" ]
  pull_request:
    branches: [ "idroid-3.0.0" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build Kernel
      run: sudo apt update && sudo apt full-upgrade && sudo apt-get install git-core libncurses5-dev && make config
